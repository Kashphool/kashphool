            widget: "object"
            fields:
              - {
                  label: "Heading prefix",
                  name: "headingPrefix",
                  widget: "string",
                }
              - {
                  label: "Heading accent",
                  name: "headingAccent",
                  widget: "string",
                }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Button label", name: "button", widget: "string" }
          - label: "Enquiry modal"
            name: "enquiryModal"
            widget: "object"
            fields:
