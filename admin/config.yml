          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Description", name: "description", widget: "text" }
              - {
                  label: "Quick links heading",
                  name: "quickLinksHeading",
                  widget: "string",
                }
              - {
                  label: "Connect heading",
                  name: "connectHeading",
                  widget: "string",
                }
              - {
