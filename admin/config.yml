  - name: "shared"
    label: "Shared Content"
    description: "Edit navigation, footer, contact details and external links used across the site."
    files:
      - name: "site_content"
        label: "Shared Site Content"
        editor:
          preview: false
        file: "client/public/data/site-content.json"
        format: "json"
        fields:
          - label: "Navigation"
            name: "navigation"
            widget: "object"
            fields:
              - {
                  label: "Home label",
                  name: "home",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "About label",
                  name: "about",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "Events label",
                  name: "events",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "Gallery label",
                  name: "gallery",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "Sponsors label",
                  name: "sponsors",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "Constitution label",
                  name: "constitution",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "Contact label",
                  name: "contact",
                  widget: "object",
                  fields: [{ label: "Label", name: "label", widget: "string" }],
                }
              - {
                  label: "Donate label",
                  name: "donate",
                  widget: "object",
